<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#162A3D;--gold:#F4AC23;--white:#FFFFFF;--mist:#AFC0D3;--rule:rgba(255,255,255,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;background:var(--navy);font-family:Montserrat,sans-serif;color:var(--white);position:relative;overflow:hidden}
.bar{position:absolute;left:0;right:0;height:14px;background:var(--gold)}
.top{top:0}.bot{bottom:0}
.wm{position:absolute;right:-150px;bottom:330px;width:820px;opacity:.06}
.wrap{position:absolute;left:96px;right:96px;top:270px;bottom:350px;display:flex;flex-direction:column}
.lock{display:flex;align-items:center;gap:40px}
.lock img.a{height:104px} .lock img.n{height:112px}
.lock .div{width:2px;height:96px;background:var(--gold);opacity:.8}
.eyebrow{display:flex;align-items:center;gap:22px;color:var(--gold);font-weight:700;font-size:30px;letter-spacing:.24em;text-transform:uppercase}
.eyebrow:before{content:"";width:64px;height:3px;background:var(--gold)}
.short{width:120px;height:8px;background:var(--gold)}
.foot{font-weight:600;font-size:28px;letter-spacing:.04em;color:var(--mist)}
</style><style>
.count{display:flex;align-items:baseline;gap:28px;margin-top:72px}
.count .n{font-weight:800;font-size:210px;line-height:.9;color:var(--gold);letter-spacing:-.02em}
.count .t{font-weight:800;font-size:84px;line-height:.95;color:var(--white);text-transform:uppercase;letter-spacing:.01em}
h1{font-weight:800;font-size:78px;line-height:1.08;letter-spacing:-.01em;margin-top:56px}
.sub{margin-top:40px;font-weight:700;font-size:46px;line-height:1.25}
.sub span{color:var(--gold)}
.cta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;border-top:2px solid var(--rule);padding-top:36px}
.cta .go{white-space:nowrap;font-weight:700;font-size:32px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
</style></head><body>
